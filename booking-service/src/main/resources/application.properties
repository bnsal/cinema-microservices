spring.application.name=booking-service
server.port=8082

spring.datasource.url=jdbc:h2:file:./data/booking-service;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# reject a fractional value where a whole number is expected instead of silently truncating it
spring.jackson.deserialization.accept-float-as-int=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

booking.reservation.ttl-minutes=15

services.event.url=http://localhost:8081

spring.cloud.openfeign.client.config.eventService.connect-timeout=500
spring.cloud.openfeign.client.config.eventService.read-timeout=3000

resilience4j.circuitbreaker.instances.eventService.sliding-window-size=4
resilience4j.circuitbreaker.instances.eventService.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.eventService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.eventService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.eventService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.eventService.ignore-exceptions=com.cinema.booking.api.v1.show.client.exceptions.ShowNotFoundException

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
